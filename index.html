<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111919">
  <meta name="description" content="AIパートナーと、対話を重ねて謎を解く。協力型推理ゲーム MIRROR CASE の入口。現在はトップ画面の試作版です。">
  <title>MIRROR CASE — ふたりの視点で、謎を解く。</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111919'/%3E%3Cpath d='M17 49V26a15 15 0 0 1 30 0v23zm6-6V26a9 9 0 0 1 18 0v17' fill='none' stroke='%23c3aa7a' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#entrance-menu">入口メニューへ</a>
  <div class="site-shell">
    <!-- Cinematic environment, independent of future case data. -->
    <div class="world-backdrop" aria-hidden="true">
      <img src="./assets/mirror-study.webp" width="1536" height="1024" alt="" fetchpriority="high" decoding="async">
    </div>
    <header class="site-header">
      <span class="header-mark" aria-hidden="true"><svg viewBox="0 0 32 40" fill="none"><path d="M3 37V16a13 13 0 0 1 26 0v21H3Z M9 31V16a7 7 0 0 1 14 0v15H9Z"/><path d="M16 9v22"/></svg></span>
      <p>AIパートナーと遊ぶ協力型推理ゲーム</p>
      <span class="edition">入口・試作版</span>
    </header>
    <main class="entrance" aria-labelledby="page-title">
      <section class="intro">
        <p class="intro-line"><span aria-hidden="true"></span>ふたりの視点で、謎を解く。</p>
        <h1 id="page-title" aria-label="MIRROR CASE"><span>MIRROR</span><span class="title-second">CASE<span class="title-stop" aria-hidden="true">.</span></span></h1>
        <p class="lead">気づいたことを、話そう。<br>AIパートナーと、ひとつの事件に向き合う。</p>
        <nav class="entrance-menu" id="entrance-menu" aria-label="入口メニュー" tabindex="-1">
          <button class="start-button" type="button" data-action="new-case" aria-haspopup="dialog">
            <svg class="door-icon" viewBox="0 0 24 28" fill="none" aria-hidden="true"><path d="M3 25V10a9 9 0 0 1 18 0v15H3Z M8 25V10a4 4 0 0 1 8 0v15"/><path d="M12 15h1"/></svg>
            <span>事件をはじめる</span><span class="arrow" aria-hidden="true">↗</span>
          </button>
          <button class="resume-button" type="button" data-action="resume" aria-haspopup="dialog" aria-describedby="resume-note"><span>つづきから</span><span id="resume-note">保存された事件はありません</span></button>
          <div class="secondary-menu">
            <button type="button" data-action="archive" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 3h12v18H5z M8 7h6 M8 11h6 M8 15h4 M17 6h3v15h-3"/></svg><span>事件記録</span><span class="small-arrow" aria-hidden="true">↗</span></button>
            <button type="button" data-action="settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 7h18 M3 17h18 M8 4v6 M16 14v6"/></svg><span>設定</span><span class="small-arrow" aria-hidden="true">↗</span></button>
          </div>
          <p class="pair-summary" id="pair-summary" hidden><span>探偵：<bdi id="pair-detective"></bdi></span><span>助手：<bdi id="pair-assistant"></bdi></span></p>
        </nav>
        <noscript><p class="notice">入口メニューを開くには、JavaScriptを有効にしてください。</p></noscript>
      </section>
      <div class="scene-space" aria-hidden="true"></div>
    </main>
    <footer class="site-footer">
      <p><span class="footer-dot" aria-hidden="true"></span>入口の試作版です。ゲーム本編は準備中。</p>
      <span class="signature">© 2026 MIRROR ROOM / NAYA &amp; NAY</span>
    </footer>
  </div>
  <dialog id="entry-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <div class="dialog-topline"><span class="dialog-brand">MIRROR CASE</span><button class="close-button" type="button" data-close aria-label="閉じる">×</button></div>
    <h2 id="dialog-title" tabindex="-1"></h2><p id="dialog-description"></p>
    <form id="pair-form" class="registry-form" hidden>
      <p class="registry-rule">記録は探偵へ。現場は助手へ。</p>
      <div class="registry-entry">
        <label for="detective-name">探偵名 <span>AIパートナー</span></label>
        <input id="detective-name" name="detectiveName" type="text" required maxlength="40" placeholder="例：ホームズ" autocomplete="off" dir="auto" aria-describedby="pair-form-note pair-error">
        <label for="assistant-name">助手名 <span>現場を訪れる人</span></label>
        <input id="assistant-name" name="assistantName" type="text" required maxlength="40" placeholder="例：ワトソン" autocomplete="off" dir="auto" aria-describedby="pair-form-note pair-error">
      </div>
      <p class="registry-message">二つの視点を合わせ、最後にひとつの報告を残してください。</p>
      <p class="settings-note" id="pair-form-note">名前は各40文字まで。このブラウザに保存します。</p>
      <p class="registry-error" id="pair-error" role="alert"></p>
      <button class="registry-submit" id="pair-submit" type="submit">二人の名前を記帳する<span aria-hidden="true">↗</span></button>
    </form>
    <section class="registry-result" id="pair-result" hidden aria-label="登録された二人">
      <p class="registry-seal" id="pair-seal" hidden role="status">記帳済</p>
      <dl class="registry-names"><div><dt>探偵</dt><dd><bdi id="result-detective"></bdi></dd></div><div><dt>助手</dt><dd><bdi id="result-assistant"></bdi></dd></div></dl>
      <button class="registry-submit" id="receive-case" type="button">最初のCASEを受け取る<span aria-hidden="true">↗</span></button>
    </section>
    <div class="pair-settings" id="pair-settings" hidden>
      <button class="pair-edit" id="edit-pair" type="button">登録簿の名前を変更する<span aria-hidden="true">↗</span></button>
    </div>
    <fieldset class="text-settings" id="text-settings" hidden>
      <legend>文字の大きさ</legend>
      <div class="size-options">
        <label><input type="radio" name="text-size" value="standard" checked><span>標準</span></label>
        <label><input type="radio" name="text-size" value="large"><span>大きめ</span></label>
      </div>
      <p class="settings-note" id="settings-note" aria-live="polite">このブラウザに保存します。</p>
    </fieldset>
    <button class="dialog-return" type="button" data-close>入口に戻る<span aria-hidden="true">↗</span></button>
  </dialog>
</body>
</html>
