<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121216" />
  <title>MIRROR CASE</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="brand">MIRROR CASE</div>
      <span class="status-pill">仮設版</span>
    </header>
    <main class="home" aria-labelledby="page-title">
      <section class="hero">
        <p class="eyebrow">AIパートナーと遊ぶ推理ゲーム</p>
        <h1 id="page-title">事件の中身は、まだ空っぽ。</h1>
        <p class="lead">いまはゲーム内容を入れる前の「家」だけ。ここから事件、カード、セーブ、対戦を育てていく。</p>
      </section>
      <section class="entry-grid" aria-label="ゲーム入口">
        <button class="entry-card primary" type="button" data-placeholder="new-case"><span class="entry-title">事件をはじめる</span><span class="entry-note">まだ未実装</span></button>
        <button class="entry-card" type="button" data-placeholder="resume"><span class="entry-title">つづきから</span><span class="entry-note" id="resume-note">セーブデータなし</span></button>
        <button class="entry-card" type="button" data-placeholder="archive"><span class="entry-title">事件記録</span><span class="entry-note">まだ未実装</span></button>
        <button class="entry-card" type="button" data-placeholder="settings"><span class="entry-title">設定</span><span class="entry-note">まだ未実装</span></button>
      </section>
      <p class="dev-note" id="dev-note" aria-live="polite">家だけ完成。ゲーム内容はこれから。</p>
    </main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
